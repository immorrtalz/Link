
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>URL shortener</title>
		<meta name='description' content='Simple URL shortener with modern design'/>
		<!-- <link rel='icon' type="image/svg+xml" href='./favicon.svg'/> -->
		<link rel='stylesheet' href='./styles.css'/>
	</head>

	<body>
		<div class="mainContainer">
			<h1>URL shortener</h1>

			<div class="authorContainer">
				<p>Made by</p>
				<a href="https://github.com/immorrtalz/Link" target="_blank">immorrtalz</a>
			</div>

			<p>Paste the link you want to shorten below:</p>

			<input type="text" id="linkInput" placeholder="Enter your link here"/>

			<div class="shortUrlContainer">
				<p id="shortUrlMessage">Click to copy:</p>
				<a id="shortUrlLink" href="" target="_blank"></a>
			</div>

			<button id="shortenButton">Shorten</button>
		</div>

		<script type="module" src="./main.js"></script>
	</body>
</html>
